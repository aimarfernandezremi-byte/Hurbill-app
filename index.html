b=H(t('q3'))+`<div class="card">${hb}${H(q.l,'h3')}</div><div class="chips">`+[['d',0,'today'],['d',1,'tomorrow'],['t','11:00','morn'],['t','17:00','aft']].map(x=>`<button class="btn ${(x[0]=='d'&&w.date==iso(Date.now()+x[1]*DAY))||(x[0]=='t'&&w.time==x[1])?'on':''}" onclick="A.q('${x[0]}','${x[1]}')">${t(x[2])}</button>`).join('')+`</div>
<label for="d">${t('date')}</label><input id="d" type="date" min="${iso(Date.now())}" value="${w.date}" onchange="A.set('date',this.value)">
<label for="tm">${t('time')}</label><input id="tm" type="time" value="${w.time}" onchange="A.set('time',this.value)">`}
if(w.s==4)b=H(t('q4'))+`<div class="card">${fd('name','name')}${fd('addr','addr','text','Calle Ercilla 24, Bilbao')}${fd('phone','phone','tel','600 000 000')}${ar('tasks','tasks',3)}${ar('notes','notes',2)}</div>
<div class="card">${H(t('shareq'),'h3')}${P(t('shareexp')+(w.mode=='h'?'':' '+t('nodisc')))}`+[0,1,2].map(i=>`<div class="svc ${w.share===i?'on':''}"><div class="row"><button class="pick" aria-pressed="${w.share===i}" onclick="A.set('share',${i})">${t('sh'+i)}</button>${sp(t('sh'+i))}</div></div>`).join('')+`</div>
<div class="card"><div class="row"><label class="chk"><input type="checkbox" ${w.pub?'checked':''} onchange="A.set('pub',this.checked?1:0)"><span>${t('pubq')}</span></label>${sp(t('pubq'))}</div>${w.pub?fd('barrio','barrio2','text','Ametzola'):''}</div>`;
if(w.s==5){const n=1+w.share,q=quote(w),d=w.mode=='h'?disc(n):0,g=q.g,tot=g*(1-d),sv=svcName(w);
const txt=`${sv}. ${w.date} ${w.time}. ${q.l}. ${w.addr}. ${t('total')}: ${fmt(tot)} €`;
b=H(t('q5'))+`<div class="card"><div class="row"><div><b>${esc(sv)}</b><br>📅 ${w.date} · ${w.time}<br>⏱ ${esc(q.l)}<br>👤 ${esc(w.name)} · 📞 ${esc(w.phone)}<br>📍 ${esc(w.addr)}<br>📝 ${esc(w.tasks)}${w.notes?'<br>🗒 '+esc(w.notes):''}${w.pub?'<br>👥 '+esc(w.barrio):''}</div>${sp(txt)}</div>
<div class="bd"><div>${t('base')}: <b>${fmt(g)} €</b></div>${d?`<div>${t('disc')} (−${d*100} %): <b>−${fmt(g*d)} €</b></div>`:''}<div style="font-size:1.4rem">${t('total')}: <b>${fmt(tot)} €</b></div></div></div>
<button class="big pri" onclick="A.confirm()"><span class="ic">✅</span>${t('confirm')}</button>`}
return BK()+`<div class="card"><div class="row"><b>${t('step',w.s)}</b>${sp(t('step',w.s))}</div><div class="prog"><i style="width:${w.s*20}%"></i></div>${b}${S.err?`<p class="err" role="alert">${S.err}</p>`:''}
<div class="chips" style="justify-content:space-between"><button class="btn" onclick="A.prev()">${t('prev')}</button>${w.s<5?`<button class="btn pri" onclick="A.next()">${t('next')}</button>`:''}</div></div>`}

function reqs(){const L=[...S.reqs].sort((a,b)=>b.id-a.id),td=iso(Date.now());
let b=BK()+(S.msg?`<div class="toast" role="status">${S.msg}</div>`:'')+H(t('b2'),'h1');
if(!L.length)b+=P(t('noreq'));
L.forEach(r=>{const nm=svcName(r),av=r.w?avg(r.w):null,sosOn=r.date===td&&r.st<3;
const sm=`${nm}. ${r.date} ${r.time}. ${t('st'+r.st)}. ${r.w||t('nobody')}`;
let rt='';
if(r.st==3){if(r.rating)rt=`<p>${'★'.repeat(r.rating.n)}${'☆'.repeat(5-r.rating.n)} ${esc(r.rating.x)} <b>${t('thanks')}</b></p>`;
else if(Date.now()-r.done<DAY)rt=`<h3>${t('rate',r.w||'')}</h3><div>`+[1,2,3,4,5].map(n=>`<button class="star ${(S.rt[r.id]||0)>=n?'on':''}" aria-label="${n}" onclick="A.star(${r.id},${n})">★</button>`).join('')+`</div><textarea id="c${r.id}" rows="2" placeholder="${t('comment')}"></textarea><button class="btn pri" onclick="A.rate(${r.id})">${t('send')}</button>`;
else rt=`<p class="err">${t('late')}</p>`}
b+=`<div class="card"><div class="row"><div><h3>${esc(nm)}</h3><span class="badge ${r.st==3?'st3':''}">${t('st'+r.st)}</span><p>📅 ${r.date} · ${r.time} · ${r.hours} ${t('hrs')}<br>📍 ${esc(r.addr)}<br>👤 ${esc(r.w||t('nobody'))}${av?' ★ '+av:''}<br>💶 ${fmt(r.total)} € · ${modeTxt(r)}</p></div>${sp(sm)}</div>
${sosOn?`<div class="sos">${t('sos')}<br>${t('sosn')}<br><a href="tel:644270017">📞 644 270 017</a></div>`:''}
<button class="btn wa" onclick="A.wa(${r.id})">💬 ${t('wa')}</button>${rt}</div>`});
return b}

function comm(){let b=BK()+H(t('b3'),'h1')+`<div class="chips">`+['wall','neigh','plans'].map(k=>`<button class="btn ${S.tab==k?'on':''}" onclick="A.tab('${k}')">${t('tab_'+k)}</button>`).join('')+`</div>`;
if(S.tab=='wall')return b+wall();
if(S.tab=='neigh'){b+=H(t('neighh'))+`<div class="grid">`+S.neigh.map(v=>{const mu=v.f&&v.m,x=`${v.n} ${v.u}. ${v.b}. ${v.i[li()]}`;return `<div class="card"><div class="row"><div><h3>${esc(v.n)}</h3><span class="muted">${esc(v.u)}</span><p>📍 ${esc(v.b)}<br>${esc(v.i[li()])}${v.m&&!v.f?`<br><span class="badge">${t('youf')}</span>`:''}</p></div>${sp(x)}</div><div class="chips"><button class="btn ${v.f?'on':''}" aria-pressed="${!!v.f}" onclick="A.fol(${v.id})">${v.f?'✓ '+t('fing'):'+ '+t('fol')}</button>${mu?`<button class="btn pri" onclick="A.openChat('n${v.id}')">${t('fchat')}</button>`:''}</div></div>`}).join('')+`</div>`;return b}
S.plans.forEach(p=>{const me=p.p.includes(S.prof.name),n=p.p.length,d=disc(n),pr=13*(1-d),title=p.t[li()];
const x=`${title}. ${p.when[li()]}. ${t('ppl',n,d*100,fmt(pr))}`;
b+=`<div class="card"><div class="row"><div><h3>${esc(title)}</h3><p>🗓 ${p.when[li()]}<br>👥 ${esc(p.p.join(', '))}<br><span class="badge">${t('ppl',n,d*100,fmt(pr))}</span></p></div>${sp(x)}</div>
<button class="btn ${me?'':'pri'}" onclick="A.join(${p.id})">${me?t('leave'):t('join')}</button>
<div class="sec"><h3>💬 ${t('chat')}</h3>${p.c.map(m=>`<div class="row msg ${m.me?'me':''}"><div><b>${esc(m.n)}</b><br>${esc(m.x)}</div>${sp(m.n+'. '+m.x)}</div>`).join('')}
<div class="row"><input id="m${p.id}" placeholder="${t('msgph')}" aria-label="${t('msgph')}" onkeydown="if(event.key==='Enter')A.chat(${p.id})"><button class="btn pri" onclick="A.chat(${p.id})">${t('send')}</button></div></div></div>`});
return b}
function F(o,P,k,lab,type='text',ph=''){const pw=k=='pass';return `<label for="f${k}">${t(lab)}</label><div class="row"><input id="f${k}" type="${pw?(S.sp?'text':'password'):type}" placeholder="${ph}" autocomplete="off" value="${esc(o[k])}" oninput="${P}.${k}=this.value">${pw?`<button class="btn" onclick="A.spw()">${S.sp?t('hide'):t('show')}</button>`:''}${sp(t(lab))}</div>`}
function prof(){const p=S.prof,fl=(o,P)=>F(o,P,'name','fullname')+F(o,P,'user','user','text','@aimar_bilbao')+F(o,P,'contact','contact','text','correo@ejemplo.es')+F(o,P,'pass','pass')+F(o,P,'addr','barrio')+F(o,P,'fam','fam','tel','600 000 000');
const er=S.err?`<p class="err" role="alert">${S.err}</p>`:'';
if(p.in)return BK()+`<div class="card">${H(t('prof'),'h1')}${S.msg?`<div class="toast" role="status">${S.msg}</div>`:''}${fl(p,'S.prof')}<div class="chips"><button class="btn pri" onclick="A.saveProf()">${t('save')}</button><button class="btn" onclick="A.logout()">${t('logout')}</button></div></div>`+tarifas();
return BK()+`<div class="card">${H(t('login')+' / '+t('create'),'h1')}<div class="chips">`+['login','create'].map(k=>`<button class="btn ${S.au==k?'on':''}" onclick="A.au('${k}')">${t(k)}</button>`).join('')+`</div>`+(S.au=='create'?fl(S.fm,'S.fm'):F(S.fm,'S.fm','user','user')+F(S.fm,'S.fm','pass','pass'))+er+`<button class="btn pri" style="margin-top:.8rem" onclick="A.${S.au}()">${t(S.au)}</button></div>`}
const BN=[5,10,20],CATS=[['🚶','Paseo','Pasealdia'],['☕','Compañía','Lagunartea'],['🛒','Compras','Erosketak'],['📱','Móvil y trámites','Mugikorra eta izapideak'],['🏥','Salud','Osasuna'],['🏠','Hogar','Etxea']];
const PL=[{h:12,p:132,n:'Plan Mensual Hurbil',d:['12 h/mes · 11 €/h · acompañante de confianza','12 h/hil · 11 €/h · konfiantzazko laguntzailea']},
{h:8,p:92,n:'Plan Cercanía',d:['8 h/mes · 2 h/semana · 11,50 €/h · acompañante fijo','8 h/hil · 2 h/aste · 11,50 €/h · laguntzaile finkoa']},
{h:16,p:176,n:'Plan Tranquilidad',d:['16 h/mes · 4 h/semana · 11 €/h · prioridad de horario y seguimiento familiar','16 h/hil · 4 h/aste · 11 €/h · ordutegi lehentasuna eta familiaren jarraipena']},
{h:30,p:300,n:'Plan Contigo Siempre',d:['30 h/mes · acompañamiento diario · 10 €/h · atención preferente','30 h/hil · eguneroko laguntza · 10 €/h · arreta lehenetsia']}];
const bono=h=>h>=20?[20,220+(h-20)*12.5]:h>=10?[10,115+(h-10)*12.5]:[5,60+(h-5)*12.5];
function quote(w){if(w.mode=='b'){const[b,p]=bono(w.bh),x=w.bh-b;return{h:w.bh,g:p,l:x?t('bonox',b,x)+' = '+fmt(p)+' €':t('bonol',b,fmt(p))}}
if(w.mode=='m'){const p=PL[w.plan||0];return{h:p.h,g:p.p,l:p.n+' · '+t('permes',p.p)}}
return{h:w.hours,g:w.hours*13,l:t('calc',w.hours,fmt(w.hours*13))}}
const modeTxt=r=>r.mode=='m'?PL[r.pl||0].n:r.mode=='b'?t('tm_b'):t('tm_h');
function tarifas(){const L=[['Horas sueltas: 13 €/hora (de 1 a 6 h).','Ordu bakarrak: 13 €/ordu (1etik 6ra).'],['Bono 5 h: 60 € (12 €/h). Horas extra a 12,50 €/h; a las 10 h pasa al Bono 10 h.','5 orduko bonua: 60 € (12 €/ordu). Ordu gehigarriak 12,50 €/orduko; 10 orduan 10 orduko bonura pasatzen da.'],['Bono 10 h: 115 € (11,50 €/h). Horas extra a 12,50 €/h; a las 20 h pasa al Bono 20 h.','10 orduko bonua: 115 € (11,50 €/ordu). Ordu gehigarriak 12,50 €/orduko; 20 orduan 20 orduko bonura pasatzen da.'],['Bono 20 h: 220 € (11 €/h).','20 orduko bonua: 220 € (11 €/ordu).'],...PL.map(p=>[p.n+': '+p.d[0],p.n+': '+p.d[1]])];
return `<div class="card">${H(t('tar'),'h2')}<p class="badge">${t('myplan')}: ${esc(S.prof.plan||t('tm_h'))}</p>`+L.map(x=>P('• '+x[li()])).join('')+`</div>`}
function modal(){if(S.modal!=='sos')return '';const ad=S.prof.addr||'Bilbao',al=t('sosd')+': '+ad;
return `<div class="mod" role="dialog" aria-modal="true"><div class="mbox"><div class="row"><h2 style="color:#B94A48">${t('sos2')}</h2>${sp(t('sos2')+'. '+t('sosn2')+' '+al)}</div>
<div class="sos" role="alert">${t('sosn2')}<br>📍 ${t('sosd')}: ${esc(ad)}</div>
<a class="big sosb2" href="tel:644270017"><span class="ic">📞</span>644 270 017</a>
<button class="big btn wa" style="font-size:1.2rem" onclick="A.waSos()">💬 ${t('wa')}</button><button class="btn" onclick="A.modal(null)">✕ ${t('close')}</button></div></div>`}
function chats(){const msg=m=>`<div class="row msg ${m.me?'me':''}"><div><b>${esc(m.n)}</b><br>${esc(m.x)}</div>${sp(m.n+'. '+m.x)}</div>`;
if(S.cv){const k=S.cv,v=S.neigh.find(x=>'n'+x.id==k),nm=k=='team'?t('supp'):v?v.n:'',c=S.th[k]||[];
return `<button class="btn back" onclick="A.openChat(null)">${t('backl')}</button><div class="card"><div class="row"><h2>💬 ${esc(nm)}</h2>${sp(nm)}</div><div class="msgs">${c.map(msg).join('')}</div><div class="row"><input id="cm" placeholder="${t('msgph')}" aria-label="${t('msgph')}" onkeydown="if(event.key==='Enter')A.csend()"><button class="btn pri" onclick="A.csend()">${t('send')}</button></div></div>`}
const mu=S.neigh.filter(v=>v.f&&v.m);
return BK()+H(t('b_chats'),'h1')+`<div class="card"><div class="row"><p>🔒 ${t('mutual')}</p>${sp(t('mutual'))}</div></div>
<div class="card"><div class="row"><button class="pick" onclick="A.openChat('team')"><span class="ic">🛟</span><span>${t('supp')}</span></button>${sp(t('supp'))}</div></div>`+
(mu.length?mu.map(v=>{const r=t(v.r?'rplan':'rmut');return `<div class="card"><div class="row"><button class="pick" onclick="A.openChat('n${v.id}')"><span>${esc(v.n)} <span class="muted">${esc(v.u)}</span><small>${r}</small></span></button>${sp(v.n+'. '+r)}</div></div>`}).join(''):P(t('nomut')))}
function wall(){const f=S.np;let b=`<div class="card">${H(t('newp'),'h3')}<label for="wc">${t('cat')}</label><select id="wc" onchange="S.np.cat=this.value">${CATS.map((c,i)=>`<option value="${i}" ${f.cat==i?'selected':''}>${c[0]} ${c[1+li()]}</option>`).join('')}</select>
<label for="wd">${t('date')}</label><input id="wd" type="date" value="${f.d}" onchange="S.np.d=this.value"><label for="wt">${t('time')}</label><input id="wt" type="time" value="${f.tm}" onchange="S.np.tm=this.value"><label for="wb">${t('dist')}</label><input id="wb" value="${esc(f.b)}" placeholder="Ametzola" oninput="S.np.b=this.value">${S.err?`<p class="err" role="alert">${S.err}</p>`:''}<button class="btn pri" style="margin-top:.6rem" onclick="A.pubw()">${t('pub')}</button></div>`;
S.wall.forEach(p=>{const c=CATS[p.cat],me=p.j.includes(S.prof.name),x=`${p.n} ${p.u}. ${c[1+li()]}. ${p.d} ${p.tm} ${p.b}. ${t('pj')}`;
b+=`<div class="card"><div class="row"><div><h3>${esc(p.n)}</h3><span class="muted">${esc(p.u)}</span></div>${sp(x)}</div>
<p>${c[0]} <b>${c[1+li()]}</b><br>📅 ${p.d} · ${p.tm} · 📍 ${esc(p.b)}</p><span class="badge">${t('pj')}</span>
<div class="chips" style="align-items:center"><button class="btn ${me?'pri':''}" onclick="A.wj(${p.id})">${me?t('inplan'):t('joinp')}</button><b>${t('inter',p.j.length)}</b></div>
${p.nid?`<button class="big bl" onclick="A.chatWall(${p.id})">${t('chatw',esc(p.n))}</button>`:''}</div>`});
return b}
function admin(){if(!S.adm)return BK()+`<div class="card">${H(t('admin'),'h1')}<label for="ap">${t('apass')}</label><input id="ap" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')A.alogin()">${S.err?`<p class="err" role="alert">${S.err}</p>`:''}<button class="btn pri" onclick="A.alogin()">${t('enter')}</button></div>`;
const o=(arr,sel)=>arr.map(([v,l])=>`<option value="${v}" ${v==sel?'selected':''}>${l}</option>`).join('');
return BK()+H(t('admin'),'h1')+`<button class="btn" onclick="A.alogout()">${t('logout')}</button><div class="card tw" style="margin-top:1rem"><table><tr><th>#</th><th></th><th>${t('worker')}</th><th>${t('state')}</th><th></th></tr>`+
S.reqs.map(r=>`<tr><td>${r.id>99?'·':r.id}</td><td><b>${esc(svcName(r))}</b><br>${r.date} ${r.time} · ${r.hours} ${t('hrs')} · ${fmt(r.total)} €<br>${esc(r.addr)}</td>
<td><select aria-label="${t('worker')}" onchange="A.aw(${r.id},this.value)">${o([['',t('nobody')],...W.map(w=>[w,w])],r.w)}</select></td>
<td><select aria-label="${t('state')}" onchange="A.as(${r.id},this.value)">${o([0,1,2,3,4].map(i=>[i,t('st'+i)]),r.st)}</select></td>
<td><button class="btn pri" onclick="A.as(${r.id},1)">✅ ${t('accept')}</button> <button class="btn" onclick="A.as(${r.id},4)">❌ ${t('reject')}</button> <button class="btn" onclick="A.sim(${r.id})">${t('sim')}</button></td></tr>`).join('')+`</table></div>
<div class="card tw">${H(t('accts'),'h2')}<table><tr><th>${t('fullname')}</th><th>@</th><th>${t('contact')}</th><th>${t('dist')}</th><th>${t('fam')}</th><th>${t('myplan')}</th></tr>`+
[S.prof,...S.neigh].map(u=>`<tr><td>${esc(u.name||u.n)}</td><td>${esc(u.user||u.u||'')}</td><td>${esc(u.contact||u.c||'—')}</td><td>${esc(u.addr||u.b||'')}</td><td>${esc(u.fam||'—')}</td><td>${esc(u.plan||u.pl||t('tm_h'))}</td></tr>`).join('')+`</table></div>`+
W.map(w=>{const a=S.rates.filter(r=>r.w===w);return `<div class="card"><h3>${w} · ${t('avg')}: ${avg(w)?'★ '+avg(w):t('none')}</h3>${a.map(r=>`<p>${'★'.repeat(r.n)}${'☆'.repeat(5-r.n)} ${esc(r.x)}</p>`).join('')}</div>`}).join('')}

function R(){
document.documentElement.lang=S.lang==='eu'?'eu':'es';
document.documentElement.style.fontSize=(18*S.fs*(S.easy?1.2:1))+'px';
document.body.classList.toggle('hc',!!S.hc);document.body.classList.toggle('easy',!!S.easy);
$bar.innerHTML=`<div class="in"><button class="brand" onclick="A.go('home')" aria-label="Hurbil">${LOGOI}<span><b>${t('brand')}</b><small>📍 Bilbao</small></span></button>
<div class="ctl"><div class="seg"><button class="sg ${S.lang=='es'?'on':''}" onclick="A.lang('es')" aria-label="Español">ES</button><button class="sg ${S.lang=='eu'?'on':''}" onclick="A.lang('eu')" aria-label="Euskara">EU</button></div>
<div class="seg"><button class="sg" onclick="A.fs(-.1)" aria-label="A-">A-</button><button class="sg" onclick="A.fs(.1)" aria-label="A+">A+</button></div>
<button class="circ" onclick="A.hc()" aria-pressed="${!!S.hc}" aria-label="${t('hc')}" title="${t('hc')}">◐</button>
<button class="tg ${S.easy?'on':''}" role="switch" aria-checked="${!!S.easy}" onclick="A.easy()">${t('easy')}</button>
<button class="pill" onclick="A.go('prof')">👤 ${esc((S.prof.name||'').split(' ')[0]||'—')}</button></div></div>`;
$adm.textContent=t('admin');$ft.textContent=t('team')+' · Bilbao · Tel. 644 270 017';
const v=location.hash==='#admin'?'admin':S.v;
$app.innerHTML=({home,ask,reqs,comm,prof,admin,chats})[v]();
$ov.innerHTML=`<div class="fabs"><button class="fab c" onclick="A.openChat(null)">💬 Chats</button><button class="fab s" onclick="A.modal('sos')">🆘 SOS</button></div>`+modal();
const mm=document.querySelector('.msgs');if(mm)mm.scrollTop=1e9;mark();
save()}
const $bar=document.getElementById('bar'),$app=document.getElementById('app'),$adm=document.getElementById('adm'),$ov=document.getElementById('ov'),$ft=document.getElementById('ft');
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;R()}});
addEventListener('hashchange',()=>{R();scrollTo(0,0)});
R();
</script>
</body>
